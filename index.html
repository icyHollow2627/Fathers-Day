<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giftcard Hari Ayah</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <section class="editor">
      <input id="inNama" placeholder="Nama ayah">
      <textarea id="inMessage" rows="3" placeholder="Pesan buat ayah"></textarea>
      <input id="inFrom" placeholder="Ketik namamu">
      <button id="btnBuat">Buat kartu</button>
      <button id="btnBagikan">Bagikan lewat WA</button>
    </section>
    <main class="kartu" id="kartu">
      <div class="cover">
       <h1>HAPPY FATHER'S DAY</h1>
       <p>Klik untuk buka</p>
      </div>
      <div class="isi">
        <h2 id="for">Buat Ayah</h2> 
        <p id="message">Makasih buat kerja keras, jerih payah, dan doanya juga</p>
        <span class="from">Your precious one</span>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
